name: CI

on:
  push:
    branches: [ swt-assignment-5-ui-and-api-tests ]
  pull_request:
    branches: [ swt-assignment-5-ui-and-api-tests ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CLIMATIQ_API_KEY: ${{ secrets.CLIMATIQ_API_KEY }}
      OPEN_ROUTE_SERVICE_API_KEY: ${{ secrets.OPEN_ROUTE_SERVICE_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
      BREACT_API_KEY: ${{ secrets.BREACT_API_KEY }}

    steps:
    - name: Checkout main project
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Frontend dependencies
      working-directory: frontend
      run: npm install

    - name: Clone and start ecotracker-odoo
      run: |
        git clone https://${{ secrets.ODOO_FORK_TOKEN }}@github.com/rukayah-jabr/ecotracker-odoo.git
        cd ecotracker-odoo
        pip install -r requirements.txt
        nohup python app.py &

    - name: Start backend (FastAPI)
      run: nohup python eco_tracker/api.py &
      working-directory: ./ # optional

    - name: Start frontend (Vite)
      working-directory: frontend
      run: nohup npm run dev &

    - name: Wait for services to start
      run: |
        # Warten, bis Backend und Odoo verfügbar sind (Healthcheck)
        for i in {1..15}; do
          if curl --silent --fail http://localhost:8000; then
            echo "Backend ready!"
            break
          fi
          if curl --silent --fail http://localhost:8069; then
            echo "Odoo ready!"
            break
          fi
          echo "Waiting for services to start..."
          sleep 2
        done

    - name: Run unit/integration tests (all except API/e2e)
      run: |
        pytest \
          --ignore-glob="**/test_pipeline_category_1_emissions.py" \
          --ignore-glob="**/test_pipeline_category_4_emissions.py"

    - name: Run test_pipeline_category_1_emissions (API)
      run: pytest **/test_pipeline_category_1_emissions.py

    - name: Run test_pipeline_category_4_emissions (E2E)
      run: pytest **/test_pipeline_category_4_emissions.py

    - name: Install Playwright
      run: |
        npm install -D playwright
        npx playwright install

    - name: Run Playwright UI test
      run: python playwright-ui-tests/example.py

