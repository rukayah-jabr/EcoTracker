name: CI

on:
  push:
    branches: [ swt-assignment-5-ui-and-api-tests ]
  pull_request:
    branches: [ swt-assignment-5-ui-and-api-tests ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CLIMATIQ_API_KEY: ${{ secrets.CLIMATIQ_API_KEY }}
      OPEN_ROUTE_SERVICE_API_KEY: ${{ secrets.OPEN_ROUTE_SERVICE_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
      ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
      BREACT_API_KEY: ${{ secrets.BREACT_API_KEY }}

    steps:
    - name: Checkout main project
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Frontend dependencies
      working-directory: frontend
      run: npm install

    - name: Clone and start ecotracker-odoo
      run: |
        git clone https://${{ secrets.ODOO_FORK_TOKEN }}@github.com/rukayah-jabr/ecotracker-odoo.git
        cd ecotracker-odoo
        pip install -r requirements.txt
        nohup python app.py &

    - name: Start backend (FastAPI)
      run: nohup uvicorn eco_tracker.api:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
      working-directory: ./ # optional

    - name: Wait for backend to start
      run: |
        for i in {1..30}; do
          curl --silent --fail http://localhost:8000 && echo "Backend ready" && exit 0
          echo "Waiting for backend..."
          sleep 2
        done
        echo "Backend failed to start in time" >&2
        exit 1

    - name: Show backend logs for debugging
      if: failure()
      run: cat backend.log

    - name: Start frontend (Vite)
      working-directory: frontend
      run: nohup npm run dev &

    - name: Wait for all services to start
      run: |
        for i in {1..30}; do
          curl --silent --fail http://localhost:3000 && \
          curl --silent --fail http://localhost:8000 && \
          curl --silent --fail http://localhost:8069 && break
          echo "Waiting for all services to start..."
          sleep 2
        done

    - name: Debug services status
      run: |
        echo "Frontend status:"
        curl -I http://localhost:3000
        echo "Backend status:"
        curl -I http://localhost:8000
        echo "Odoo status:"
        curl -I http://localhost:8069
    
    

#    - name: Install Playwright
#      run: |
#        npm install -D playwright
#        npx playwright install

    - name: Install Playwright browsers
      run: npx playwright install

    - name: Install Playwright dependencies
      run: npx playwright install-deps

    - name: Run unit/integration tests (all except API/e2e)
      run: |
        pytest \
          --ignore="eco_tracker/test/test_pipeline_category_1_emissions.py" \
          --ignore="eco_tracker/test/test_pipeline_category_4_emissions.py" \
          --ignore="playwright-ui-tests/test_001_estimation_low.py" \
          --ignore="playwright-ui-tests/test_002_estimation_high.py" \
          --ignore="playwright-ui-tests/test_003_filtering_category.py"

    - name: Run test_pipeline_category_1_emissions (API)
      run: pytest eco_tracker/test/test_pipeline_category_1_emissions.py

    - name: Run test_pipeline_category_4_emissions (E2E)
      run: pytest eco_tracker/test/test_pipeline_category_4_emissions.py

#    - name: Install Playwright
#      run: |
#        npm install -D playwright
#        npx playwright install

    - name: Run Playwright UI tests (via pytest)
      env:
        DEBUG: "pw:api"
      run: pytest playwright-ui-tests/

